name: Verify unified integration pull request
on:
  pull_request:
    paths:
      - 'unified/**'
      - 'tests/**'
      - 'site/**'
      - '.github/workflows/pr-quality.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Compile all modules
        run: python -m compileall -q unified tests
      - name: Run all deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Check client JavaScript syntax
        run: node --check site/app.js
      - name: Verify current saved corpus can publish
        run: python -m unified.publish --root data --output /tmp/policy-domino-pr-catalog.json

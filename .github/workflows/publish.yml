name: Publish source-verified unified workbench
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified/publish.py'
      - 'site/index.html'
      - 'site/app.js'
      - 'site/style.css'
      - 'data/documents/**'
      - 'data/comparisons/**'
      - 'data/impacts/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: unified-static-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-index and user-interface contracts
        run: python -m unittest discover -s tests -v
      - name: Rebuild from the single verified data path
        run: python -m unified.publish --root data --output site/data.json
      - name: Persist generated index without changing underlying originals
        run: |
          git config user.name policy-domino-unified-bot
          git config user.email policy-domino-unified-bot@users.noreply.github.com
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'site: publish evidence-backed event index [skip ci]'
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "::error::main advanced during publication; rerun on latest source"
              exit 1
            fi
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

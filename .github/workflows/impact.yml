name: Evidence-gated public agency impact
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified/impact.py'
      - 'unified/ai.py'
      - 'data/comparisons/**'
permissions:
  contents: write
concurrency:
  group: unified-impact
  cancel-in-progress: false
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: work
      - uses: actions/checkout@v4
        with:
          repository: dodam-heo/policy-domino
          ref: b590e4324d5b6e55d805914862c8356d0bf7c1b4
          path: seed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual change-to-public-service evidence contracts
        working-directory: work
        run: python -m unittest discover -s tests -v
      - name: Bootstrap service evidence once from documented official Gov24 snapshot
        working-directory: work
        run: |
          if [ ! -f data/program-import.json ]; then
            python -m unified.impact --root data --catalog ../seed/data/public_services.json
          else
            python -m unified.impact --root data
          fi
      - name: Persist service evidence and source-verified impact records
        working-directory: work
        run: |
          git config user.name policy-domino-unified-bot
          git config user.email policy-domino-unified-bot@users.noreply.github.com
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: cache official public programs and verified institution impacts [skip ci]'
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "::error::main advanced; reschedule later without risky rebase"
              exit 1
            fi
            git push origin HEAD:main
          fi

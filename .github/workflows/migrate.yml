name: Bootstrap conflict-free historical verified originals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified/migrate.py'
permissions:
  contents: write
concurrency:
  group: unified-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: dodam-heo/policy-domino
          ref: 66212ee4060e7742ce37f114287f5afecb0244e9
          path: old-v2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dodam-heo/policy-domino
          ref: b590e4324d5b6e55d805914862c8356d0bf7c1b4
          path: current-v4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dodam-heo/policy-domino-next
          ref: 898db398694f55fc95d1d2ac188c7ea67b9e623e
          path: next
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version migration contract
        working-directory: work
        run: python -m unittest discover -s tests -v
      - name: Import verified conflict-free originals into per-version files
        working-directory: work
        run: |
          python -m unified.migrate \
            --v2 ../old-v2/data/v2_state.json \
            --v4 ../current-v4/data/v4_state.json \
            --next ../next/data/state.json \
            --root data
      - name: Commit only new version files
        working-directory: work
        run: |
          git config user.name policy-domino-unified-bot
          git config user.email policy-domino-unified-bot@users.noreply.github.com
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: reuse complete conflict-free historical originals [skip ci]'
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "::error::main advanced while importing, retry on latest checkout"
              exit 1
            fi
            git push origin HEAD:main
          fi
